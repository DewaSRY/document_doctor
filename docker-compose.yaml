services:
  ai-translation:
    image: sdewa/ai-translation:latest
    build:
      context: ./apps/ai-translation
      dockerfile: Dockerfile
    container_name: ai-translation
    restart: unless-stopped
    stop_grace_period: 45s

    ports:
      - "127.0.0.1:8081:8000"

    volumes:
      - ai-translation-model-cache:/models/huggingface

    env_file:
      - apps/ai-translation/.env

    environment:
      REST_HOST: 0.0.0.0
      REST_PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

    networks:
      - translation-network

  postgres:
    image: postgres:16
    container_name: postgres-translation-ai
    restart: unless-stopped

    env_file:
      - apps/ai-translation/.env

    ports:
      - "127.0.0.1:5437:5432"

    volumes:
      - postgres-translation-ai-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - translation-network

networks:
  translation-network:
    driver: bridge

volumes:
  postgres-translation-ai-data:
  ai-translation-model-cache:
    name: ai-translation-model-cache
