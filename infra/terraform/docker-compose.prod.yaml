# Rendered by main.tf's local.docker_compose_yml and shipped to the instance
# base64-encoded inside user_data.sh.tpl, the same way Caddyfile is.
# Lives at /opt/ai-translation/docker-compose.yml on the instance, alongside
# app.env and Caddyfile (both written by user_data.sh.tpl into the same
# directory).
#
# The env file is deliberately named app.env, not .env: compose would also
# read a .env for interpolation of this file.
services:
  ai-translation:
    image: ${docker_image}
    container_name: ai-translation
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - ai-translation-net
    # Bound to 127.0.0.1 for SSH-side debugging; Caddy reaches the API over
    # the private Docker network.
    ports:
      - "127.0.0.1:${app_port}:${app_port}"
    volumes:
      - ai-translation-model-cache:/models/huggingface
    env_file:
      - app.env
    # The API responds once the model is loaded and the database is ready.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${app_port}/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m
%{ if use_bundled_postgres ~}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${postgres_image}
    container_name: postgres
    restart: unless-stopped
    networks:
      - ai-translation-net
    volumes:
      - ai-translation-postgres-data:/var/lib/postgresql/data
    env_file:
      - app.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
%{ endif ~}

  caddy:
    image: ${caddy_image}
    container_name: caddy
    restart: unless-stopped
    networks:
      - ai-translation-net
    ports:
      - "${http_port}:80"
      - "${https_port}:443"
      - "${https_port}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ai-translation

networks:
  ai-translation-net:
    name: ai-translation-net

volumes:
  ai-translation-model-cache:
    name: ai-translation-model-cache
  caddy-data:
    name: ai-translation-caddy-data
  caddy-config:
    name: ai-translation-caddy-config
%{ if use_bundled_postgres ~}
  ai-translation-postgres-data:
    name: ai-translation-postgres-data
%{ endif ~}
