spring:
  application:
    name: coreServices

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5437/db-translation-ai}
    username: ${DATABASE_USERNAME:user-translation-ai}
    password: ${DATABASE_PASSWORD:pass-translation-ai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  grpc:
    client:
      channel:
        # Channel name referenced by @ImportGrpcClients(target = "ai-translation").
        ai-translation:
          target: static://${AI_TRANSLATION_GRPC_HOST:localhost}:${AI_TRANSLATION_GRPC_PORT:50051}
          ssl:
            # The Python server only opens an insecure port (bootstrap/server.py).
            enabled: false
          default:
            # First call after server start also loads the model, so keep this generous.
            deadline: ${AI_TRANSLATION_GRPC_DEADLINE:120s}

translation:
  smoke-test:
    # Call the AI server once on startup and log the result (see TranslationSmokeTestRunner).
    enabled: ${TRANSLATION_SMOKE_TEST_ENABLED:true}
