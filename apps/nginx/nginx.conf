# Reverse proxy + per-IP rate limiter in front of ai-translation, for local
# `docker compose up`. Mirrors infra/terraform/nginx.conf.tpl (the same
# setup deployed to EC2) but as a plain static file, since docker-compose
# has no templating step — keep the two in sync by hand if you change one.
#
# ai-translation isn't published on the host at all (see docker-compose.yaml)
# — this is the only way in, same as production.

limit_req_zone $binary_remote_addr zone=ai_translation:10m rate=25r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 60m;

    location / {
        limit_req zone=ai_translation burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://ai-translation:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
