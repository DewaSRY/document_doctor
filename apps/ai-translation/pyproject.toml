[project]
name = "ai-translation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DewaAriesta", email = "dewa.ariesta@cashenable.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "grpcio>=1.84.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
ai-translation = "ai_translation:main"
ai-translation-serve = "ai_translation.bootstrap.server:serve"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]


